        // Busca una entrega por id recorriendo todos los temas, sin depender de
        // que temaActivoId ya esté fijado — hace la navegación más robusta.
        function encontrarEntregaDiscipulado(entregaId) {
            for (let claveTema in TEMAS_DISCIPULADO) {
                const tema = TEMAS_DISCIPULADO[claveTema];
                const entrega = tema.entregas.find(e => e.id === entregaId);
                if (entrega) return { tema, entrega };
            }
            return null;
        }

        // ===================================================================
        // CONSTRUCCIÓN DE URL DE VIDEO — YouTube o Vimeo
        // ===================================================================
        // ¿DÓNDE PEGAR TU VIDEO REAL? En la constante TEMAS_DISCIPULADO (arriba),
        // busca la entrega por su id (ej. 'ira_1') y reemplaza el string del campo
        // 'video_id' — NO hace falta tocar esta función para nada.
        // Acepta CUALQUIERA de estos 4 formatos en 'video_id':
        //   1. Solo el ID de YouTube:      'dQw4w9WgXcQ'
        //   2. Link completo de YouTube:   'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
        //   3. Link corto de YouTube:      'https://youtu.be/dQw4w9WgXcQ'
        //   4. Link completo de Vimeo:     'https://vimeo.com/76979871'
        // La función detecta el formato automáticamente y arma la URL de embed
        // correcta — puedes pegar tal cual copiaste el link desde el navegador.
        function construirUrlEmbedVideo(video_id) {
            if (!video_id) return '';
            const valor = video_id.trim();

            let match = valor.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (match) return `https://player.vimeo.com/video/${match[1]}`;

            match = valor.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube-nocookie.com/embed/${match[1]}`;

            match = valor.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube-nocookie.com/embed/${match[1]}`;

            match = valor.match(/youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube-nocookie.com/embed/${match[1]}`;

            // Por defecto: se asume que 'valor' ya es un ID de YouTube directo.
            return `https://www.youtube-nocookie.com/embed/${valor}`;
        }

        // Hermana de construirUrlEmbedVideo(): arma el link para "ver directamente
        // en la plataforma" (fuera del iframe embebido). Se usa en el enlace de
        // respaldo del modal de video — algunos videos no embeben de forma
        // confiable según el navegador/origen desde el que se abra el archivo
        // .html (ej. abierto como content:// en Android en vez de http/https),
        // así que el enlace directo queda SIEMPRE visible, no solo cuando falla.
        // Mismos 4 formatos de entrada que construirUrlEmbedVideo() — si se
        // agrega un formato nuevo ahí, replicar el cambio acá también.
        function construirUrlVerVideo(video_id) {
            if (!video_id) return '';
            const valor = video_id.trim();

            let match = valor.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (match) return `https://vimeo.com/${match[1]}`;

            match = valor.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube.com/watch?v=${match[1]}`;

            match = valor.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube.com/watch?v=${match[1]}`;

            match = valor.match(/youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube.com/watch?v=${match[1]}`;

            // Por defecto: se asume que 'valor' ya es un ID de YouTube directo.
            return `https://www.youtube.com/watch?v=${valor}`;
        }

        function completarEntregaDiscipulado(entregaId) {
            const txt = document.getElementById('texto-asimilacion');
            if (!SendaEstado.datos.progresoDiscipulado) SendaEstado.datos.progresoDiscipulado = {};

                completado: true,

            };

            SendaEstado.irAFase('mapa_tema');
        }

        // --- Vista 1: Biblioteca (cuadrícula de temas principales) ---
        function VistaDiscipulados() {
            // La Biblioteca General ordena EXCLUSIVAMENTE por orden_reino — a

            const temas = Object.values(TEMAS_DISCIPULADO).sort((a, b) => (a.orden_reino ?? 999) - (b.orden_reino ?? 999));

            return `

                        <p class="text-sm text-stone-500 font-light max-w-md mx-auto leading-relaxed">Cada serie te lleva de discernir a manifestar, un paso a la vez, bajo el señorío de Jesucristo.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${temas.map(tema => {
                            const total = tema.entregas.length;
                            const completadas = tema.entregas.filter(e => progreso[e.id] && progreso[e.id].completado).length;
                            const porcentaje = total > 0 ? Math.round((completadas / total) * 100) : 0;
                            return `
                            <button onclick="irAMapaTema('${tema.id}')" class="opcion-btn text-left p-6 rounded-[2rem] border-2 border-stone-200 bg-white hover:border-senda-oliva/50 hover:shadow-md transition-all space-y-3">
                                <div class="flex items-start justify-between gap-2">
                                    <span class="text-3xl block">${tema.icono}</span>
                                    <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-1 rounded-full ${tema.categoria_tipo === 'general' ? 'bg-senda-cremaFuerte text-senda-tierra' : 'bg-senda-fondo text-senda-oliva'} flex-shrink-0">${tema.categoria_tipo === 'general' ? 'General' : 'Específico'}</span>
                                </div>
                                <h3 class="serif-title text-xl font-semibold text-senda-texto">${tema.titulo}</h3>
                                <p class="text-xs text-stone-500 font-light leading-relaxed">${tema.descripcion}</p>
                                <div class="pt-2 space-y-1.5">
                                    <div class="w-full bg-stone-100 rounded-full h-1.5">
                                        <div class="bg-senda-oliva h-1.5 rounded-full transition-all duration-500" style="width: ${porcentaje}%"></div>
                                    </div>
                                    <span class="text-[10px] text-senda-tierra font-bold uppercase tracking-wider">${completadas} de ${total} completadas</span>
                                </div>
                            </button>
                            `;
                        }).join('')}
                    </div>

                    <div class="pt-2 text-center">
                        <button onclick="salirDeDiscipulados()" class="text-xs text-stone-400 hover:text-stone-600 underline">← Volver a mi caminar diario</button>
                    </div>
                </div>
            `;
        }

        // --- Vista 2: Mapa del Tema (línea de tiempo vertical) ---
        function VistaMapaTema() {
            const tema = TEMAS_DISCIPULADO[SendaEstado.datos.temaActivoId];
            if (!tema) {
                return `
                    <div class="text-center py-10 space-y-4">
                        <p class="text-stone-500 font-light">No se encontró esta serie de discipulado.</p>
                        <button onclick="SendaEstado.irAFase('vista_discipulados')" class="text-senda-oliva underline text-sm font-semibold">Volver a la biblioteca</button>
                    </div>
                `;
            }
            const progreso = SendaEstado.datos.progresoDiscipulado || {};
            const tieneVideoReal = !!tema.video_id_biblioteca && !tema.video_id_biblioteca.startsWith('PLACEHOLDER');
            return `
                <div class="space-y-8">
                    <div class="flex items-center justify-between text-xs">
                        <button onclick="SendaEstado.irAFase('vista_discipulados')" class="text-stone-400 hover:text-stone-600 underline">← Biblioteca</button>
                        <button onclick="salirDeDiscipulados()" class="text-stone-400 hover:text-stone-600 underline">🏠 Mi Caminar</button>
                    </div>
                    <div class="text-center space-y-2">
                        <span class="text-4xl block">${tema.icono}</span>
                        <h2 class="serif-title text-3xl md:text-4xl font-medium text-senda-texto">${tema.titulo}</h2>
                        <p class="text-sm text-stone-500 font-light max-w-md mx-auto leading-relaxed">${tema.descripcion}</p>
                        <span class="text-[11px] font-mono bg-senda-cremaFuerte text-senda-tierra px-3 py-1 rounded-full font-bold inline-block">${tema.pasajeAncla}</span>
                        ${tieneVideoReal ? `
                            <div>
                                <button onclick="abrirModalVideo('${tema.video_id_biblioteca}', '${tema.titulo.replace(/'/g, "\\'")}')" class="opcion-btn inline-flex items-center gap-2 mt-1 px-4 py-2 rounded-full bg-senda-oliva text-white text-xs font-bold uppercase tracking-wider shadow-sm">
                                    <span>▶</span><span>Ver video</span>
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="relative pl-8 space-y-5">
                        <div class="absolute left-[11px] top-2 bottom-2 w-0.5 bg-stone-200"></div>
                        ${tema.entregas.map((entrega, idx) => {
                            const hecha = !!(progreso[entrega.id] && progreso[entrega.id].completado);
                            return `
                            <div class="relative">
                                <div class="absolute -left-8 top-1 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ring-4 ring-senda-fondo ${hecha ? 'bg-senda-oliva text-white' : 'bg-white border-2 border-stone-300 text-stone-400'}">
                                    ${hecha ? '✓' : idx + 1}
                                </div>
                                <button onclick="irAVistaEntrega('${entrega.id}')" class="opcion-btn w-full text-left p-5 rounded-2xl border-2 transition-all ${hecha ? 'bg-senda-fondo border-senda-oliva/30' : 'bg-white border-stone-200 hover:border-senda-oliva/40'}">
                                    <span class="text-[10px] font-bold uppercase tracking-widest ${hecha ? 'text-senda-oliva' : 'text-senda-tierra'}">${entrega.tipo}</span>
                                    <h4 class="text-base font-semibold text-senda-texto mt-0.5">${entrega.titulo}</h4>
                                </button>
                            </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="pt-2 text-center">
                        <button onclick="SendaEstado.irAFase('vista_discipulados')" class="text-xs text-stone-400 hover:text-stone-600 underline">← Volver a la biblioteca</button>
                    </div>
                </div>
            `;
        }

        // --- Vista 3: Entrega individual (video + lectura + reto de asimilación) ---
        function VistaEntregaDiscipulado() {
            const resultado = encontrarEntregaDiscipulado(SendaEstado.datos.entregaActivaId);
            if (!resultado) {
                return `
                    <div class="text-center py-10 space-y-4">
                        <p class="text-stone-500 font-light">No se encontró este contenido.</p>
                        <button onclick="SendaEstado.irAFase('vista_discipulados')" class="text-senda-oliva underline text-sm font-semibold">Volver a la biblioteca</button>
                    </div>
                `;
            }
            const { tema, entrega } = resultado;
            const progresoActual = (SendaEstado.datos.progresoDiscipulado && SendaEstado.datos.progresoDiscipulado[entrega.id]) || { completado: false, respuesta: '' };
            // Módulos generales (Obediencia, Santidad, y los 5 nuevos) usan 'verdad'/
            // 'testimonio' en vez de 'contenido' — ver el comentario junto a esos
            // temas en TEMAS_DISCIPULADO. El video ya NO vive a nivel de entrega
            // (un solo video por tema, en video_id_biblioteca — ver VistaMapaTema).
            const tieneEstructuraVerdadTestimonio = !!entrega.verdad;

            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between text-xs">
                        <button onclick="SendaEstado.irAFase('mapa_tema')" class="text-stone-400 hover:text-stone-600 underline">← Mapa de ${tema.titulo}</button>
                        <button onclick="salirDeDiscipulados()" class="text-stone-400 hover:text-stone-600 underline">🏠 Mi Caminar</button>
                    </div>

                    <div class="space-y-2">
                        <span class="text-[10px] font-bold uppercase tracking-widest text-senda-tierra">${tema.titulo} · ${entrega.tipo}</span>
                        <h2 class="serif-title text-2xl md:text-3xl font-medium text-senda-texto leading-snug">${entrega.titulo}</h2>
                    </div>

                    ${entrega.ancla_texto ? `
                        <div class="bg-senda-cremaFuerte/60 p-5 rounded-2xl border border-amber-100/60 text-center space-y-1">
                            <p class="serif-title text-lg text-senda-texto italic leading-relaxed">"${entrega.ancla_texto}"</p>
                            <span class="text-[11px] font-bold text-senda-tierra uppercase tracking-widest">${entrega.ancla_ref || tema.pasajeAncla}</span>
                        </div>
                    ` : ''}

                    ${tieneEstructuraVerdadTestimonio ? `
                        <div class="bg-white p-5 md:p-6 rounded-2xl border border-stone-200 space-y-2">
                            <span class="text-xs font-bold text-senda-oliva uppercase tracking-widest">La Verdad</span>
                            <p class="text-base text-stone-700 leading-relaxed font-light">${entrega.verdad}</p>
                        </div>
                        <div class="bg-white p-5 md:p-6 rounded-2xl border border-stone-200 space-y-2">
                            <span class="text-xs font-bold text-senda-oliva uppercase tracking-widest">El Testimonio</span>
                            <p class="text-base text-stone-700 leading-relaxed font-light">${entrega.testimonio}</p>
                        </div>
                    ` : `
                        <div class="bg-white p-5 md:p-6 rounded-2xl border border-stone-200 space-y-2">
                            <span class="text-xs font-bold text-senda-oliva uppercase tracking-widest">Lectura</span>
                            <p class="text-base text-stone-700 leading-relaxed font-light">${entrega.contenido}</p>
                        </div>
                    `}

                    <div class="bg-senda-fondo p-5 md:p-6 rounded-2xl border border-stone-200/60 space-y-3">
                        <span class="text-xs font-bold text-senda-tierra uppercase tracking-widest">Reto de Asimilación</span>
                        <p class="text-sm text-stone-600 italic leading-relaxed">${entrega.reto_asimilacion}</p>
                        <textarea id="texto-asimilacion" placeholder="Escribe tu respuesta aquí..." class="w-full h-28 p-4 text-base rounded-2xl border border-stone-200 focus:outline-none focus:border-senda-oliva bg-white resize-none font-light leading-relaxed">${progresoActual.respuesta || ''}</textarea>
                    </div>

                    <div class="space-y-3 max-w-sm mx-auto pt-2">
                        <button onclick="completarEntregaDiscipulado('${entrega.id}')" class="w-full py-4 bg-senda-oliva hover:bg-opacity-95 text-white font-bold rounded-2xl shadow-md transition-all tracking-wide">
                            ${progresoActual.completado ? '✓ Actualizar Respuesta' : 'Completar y Guardar'}
                        </button>
                        <button onclick="SendaEstado.irAFase('mapa_tema')" class="w-full text-center py-2 text-xs text-stone-400 hover:text-stone-600 underline">← Volver al mapa de ${tema.titulo}</button>
                    </div>
                </div>
            `;
        }

        // ===================================================================
        // INICIALIZACIÓN DE LA APLICACIÓN
        // ===================================================================
        window.onload = () => {
            SendaEstado.inicializar();
        };
    </script>
</body>
</html>
