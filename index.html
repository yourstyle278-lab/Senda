    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF7F2;
            color: #2C3531;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .serif-title {
            font-family: 'Playfair Display', serif;
        }
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .disolver {
            animation: disolverTexto 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes disolverTexto {
            to {
                opacity: 0;
                filter: blur(15px);
                transform: translateY(-30px);
            }
        }
        .rebote-suave {
            animation: rebote 2.2s infinite ease-in-out;
        }
        @keyframes rebote {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }
        /* Acordeón compacto del dashboard: cada sección se expande/colapsa
           animando max-height, evitando el scroll largo continuo. */
        .accordion-content {
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* Feedback visual moderno para botones de opción/selección (toggles) */
        .opcion-btn {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .opcion-btn:hover {
            transform: translateY(-1px);
        }
        .opcion-btn:active {
            transform: translateY(0);
        }
        /* Respeta preferencia de movimiento reducido */
        @media (prefers-reduced-motion: reduce) {
            .fade-in, .disolver, .rebote-suave, .opcion-btn, .accordion-content {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="bg-senda-fondo text-senda-texto selection:bg-senda-oliva selection:text-white flex flex-col min-h-screen">

    <!-- CABECERA DE LA APP -->
    <header class="w-full max-w-2xl mx-auto px-6 pt-8 pb-4 flex flex-col space-y-4 md:space-y-0 md:flex-row md:justify-between md:items-center border-b border-stone-200/40">

            <div class="flex flex-col">

        <div class="flex flex-wrap items-center justify-between md:justify-end gap-3">

    <!-- PIE DE PÁGINA -->

            "Paraos en los caminos, y mirad, y preguntad por las sendas antiguas, cuál sea el buen camino, y andad por él, y hallaréis descanso para vuestra alma."
            <span class="block mt-1 font-semibold text-senda-tierra not-italic text-xs tracking-wider uppercase">— Jeremías 6:16</span>

    <script>
        // ===================================================================
        // LA SENDA ANTIGUA — Estado global de control de flujo de confesión
        // ===================================================================
        let procesandoConfesion = false;
        let procesandoPregunta = false;
        // Estado (solo en memoria, no persistido) de qué secciones del acordeón
        // del dashboard están abiertas — sobrevive a los re-renders de la sesión.
        let accordionState = {};
        // Recuerda en qué fase estaba el usuario antes de entrar al módulo de
        // Discipulados, para poder devolverlo exactamente ahí al salir (no
        // persistido: si se recarga la página dentro del módulo, se asume
        // 'sendero_dashboard' como retorno seguro).
        let faseAntesDeDiscipulado = null;

        // ===================================================================
        // DATOS TEOLÓGICOS Y DE CONTENIDO PASTORAL
        // ===================================================================
        const PREGUNTAS_TEST = [
            { id: 'f_cansancio', cat: "Templo Físico", texto: "¿Sientes un cansancio corporal constante y profundo que ni siquiera un sueño prolongado logra aliviar?", guia: "La fatiga física suele ser el primer síntoma de un alma que intenta sostenerse sola." },
            { id: 'idolatria_control', cat: "Idolatría (Carne)", texto: "¿Sientes que tu paz y estabilidad dependen críticamente de tener bajo perfecto control tu dinero, reputación o salud?", guia: "La idolatría ocurre cuando un aspecto creado ocupa el lugar del Creador como nuestra única fuente de seguridad." },
            { id: 'hechiceria_atajos', cat: "Hechicería / Control (Carne)", texto: "Cuando te invade la impotencia, ¿recurres a la manipulación, a forzar las decisiones de otros o a atajos rápidos para calmar la ansiedad?", guia: "La carne recurre al control (pharmakeia) para anestesiar la vulnerabilidad en vez de confiar en la soberanía de Dios." },
            { id: 'enemistades_muros', cat: "Enemistades / Pleitos (Carne)", texto: "¿Te descubres construyendo muros de hielo, retirando tu afecto o usando el silencio prolongado como castigo hacia quienes te ofenden?", guia: "El orgullo de la carne nos impulsa a buscar justicia por mano propia en lugar de descansar en el Defensor de tu alma." },
            { id: 'celos_comparacion', cat: "Celos / Envidia (Carne)", texto: "Al contemplar el éxito, las bendiciones o el descanso de otros, ¿sientes una sutil frustración o la sospecha de que Dios se ha olvidado de ti?", guia: "La envidia nace de la mentira de que el Padre celestial no tiene suficiente amor o provisión para todos Sus hijos." },
            { id: 'iras_irritacion', cat: "Iras / Contiendas (Carne)", texto: "¿Experimentas una irritación interna persistente que brota con facilidad ante los errores cotidianos de la gente que te rodea?", guia: "La ira explosiva suele delatar un espíritu exhausto que no tolera la debilidad de los demás porque no soporta la suya propia." },
            { id: 'orgullo_autosuficiencia', cat: "Orgullo / Autosuficiencia (Carne)", texto: "¿Te cuesta pedir ayuda, delegar responsabilidades o reconocer ante Dios tus debilidades por temor a parecer imperfecto?", guia: "El orgullo nos susurra la mentira de que debemos ser autosuficientes para ser dignos de amor y aprobación." },
            { id: 'arrogancia_rigidez', cat: "Arrogancia (Carne)", texto: "¿Sientes a menudo la fuerte necesidad interna de demostrar que tienes la razón o de imponer tu método como el único correcto?", guia: "La arrogancia es miedo disfrazado de poder. Es un escudo rígido para proteger un corazón asustado." },
            { id: 'mansedumbre_control', cat: "Falta de Mansedumbre (Fruto)", texto: "¿Te resistes con aspereza o ansiedad interna cuando los planes cambian o cuando las circunstancias escapan de tus manos?", guia: "La mansedumbre no es cobardía; es fuerza bajo el perfecto control del Espíritu, aceptando el ritmo y la voluntad del Padre." },
            { id: 'humildad_rendimiento', cat: "Falta de Humildad (Fruto)", texto: "¿Sientes que tu valor o tu identidad ante Dios dependen directamente de tu productividad, tus buenas obras o tu activismo espiritual?", guia: "La humildad según Jesús nos libera de la obsesión de nosotros mismos, permitiéndonos recibir Su gracia incondicional." }
        ];

        const MEDICINA_TEOLOGICA = {
            celos_comparacion: { raiz: "Envidia y Comparación", sintoma: "Palpitaciones constantes, insomnio por mirar y medir el propio valor con el éxito ajeno.", pasaje: "Proverbios 14:30", textoBiblico: "El corazón apacible es vida de la carne; mas la envidia es carcoma de los huesos.", medicina: "La provisión del Padre es perfecta y suficiente para hoy. El valor de una vida no se mide con la regla ajena, sino con la mirada de Dios.", anclajeCorporal: "Colocar la mano derecha en el centro del pecho. Respirar hondo sintiendo las palpitaciones e imaginar a Jesús entregando un regalo único, con un nombre escrito en él. Exhalar la necesidad de aprobación ajena.", medicinaPersistente: "La comparación sigue midiendo el valor propio por lo que otros tienen. El Señor responde: '¿Qué a ti? Sígueme tú.' Escribir hoy tres bendiciones silenciosas recibidas esta semana ayuda a rendirse al plan individual de Dios.", pasajePersistente: "Juan 21:22" },
            orgullo_autosuficiencia: { raiz: "Orgullo y Autosuficiencia", sintoma: "Cansancio cervical severo, migrañas por cargar responsabilidades que no corresponden.", pasaje: "1 Pedro 5:6-7", textoBiblico: "Humillaos, pues, bajo la poderosa mano de Dios, para que él os exalte cuando fuere tiempo; echando toda vuestra ansiedad sobre él, porque él tiene cuidado de vosotros.", medicina: "La necesidad de parecer perfecto puede rendirse. Está bien no poder con todo; Su poder se perfecciona en la debilidad.", anclajeCorporal: "Girar el cuello lentamente en círculos amplios. Al bajar la cabeza, susurrar: 'Suelto la carga de ser mi propio salvador'. Al levantarla, recibir el aire declarando Su gracia.", medicinaPersistente: "La coraza de creer que todo puede sostenerse en soledad suele mantenerse. Dios resiste a los soberbios, pero abraza con ternura a quienes se rinden débiles. Agendar hoy una hora para delegar o pedir ayuda en lo que agobia es un paso de humildad.", pasajePersistente: "Santiago 4:6" },
            idolatria_control: { raiz: "Idolatría del Control", sintoma: "Ansiedad generalizada, acidez estomacal, colon irritable, gastritis.", pasaje: "Jeremías 17:7-8", textoBiblico: "Bendito el varón que confía en el Señor... Porque será como el árbol plantado junto a las aguas... y en el año de sequía no se fatigará.", medicina: "Las riendas de finanzas, familia y futuro pueden soltarse. El control es una ilusión; la soberanía de Dios es una realidad segura.", anclajeCorporal: "Realizar una respiración 4-7-8 (inhalar en 4, retener en 7, exhalar en 8). Al exhalar, abrir y relajar las palmas de las manos mirando al cielo, simbolizando la entrega del control sobre el mañana.", medicinaPersistente: "La persistencia de la gastritis recuerda que la mente sigue queriendo ocupar el lugar de Dios. Escribir hoy el mayor temor en un papel, guardarlo dentro de una Biblia y decir: 'Padre, esto no me pertenece a mí, sino a Ti', es un paso concreto de entrega.", pasajePersistente: "Mateo 6:34" },
            enemistades_muros: { raiz: "Amargura y Resentimiento", sintoma: "Bruxismo severo, mandíbula tensa, opresión persistente en el pecho.", pasaje: "Hebreos 12:15", textoBiblico: "Mirad bien, no sea que alguno deje de alcanzar la gracia de Dios; que brotando alguna raíz de amargura, os perturbe, y por ella muchos sean contaminados.", medicina: "El perdón no justifica al ofensor; libera la mandíbula y el corazón de una prisión. La justicia puede entregarse al único Juez Justo.", anclajeCorporal: "Colocar la yema de los dedos sobre la articulación mandibular. Abrir la boca despacio sintiendo el estiramiento y exhalar profundamente diciendo en voz alta: 'Suelto el derecho a vengarme, yo perdono'.", medicinaPersistente: "Cargar esta amargura por más de dos semanas deja huella. La persistencia de la tensión mandibular es un llamado a dejar de justificar la herida. El perdón no es un sentimiento; es una decisión de obediencia radical. Escribir hoy el nombre de esa persona y entregarle al Señor el derecho a la justicia es un paso de libertad.", pasajePersistente: "Mateo 18:21-22" },
            iras_irritacion: { raiz: "Ira e Irritabilidad", sintoma: "Presión arterial alta, dolores de cabeza punzantes, hiperventilación.", pasaje: "Salmo 37:8", textoBiblico: "Deja la ira, y depura el enojo; no te excites en manera alguna a hacer lo malo.", medicina: "La irritación suele ser el grito de un sistema nervioso agotado. No es necesario reaccionar; respirar y permitir que el Espíritu temple el carácter es el camino.", anclajeCorporal: "Cerrar los ojos, respirar de manera profunda llevando el aire al abdomen y, al exhalar, dejar caer los hombros completamente sueltos. Permitir que el silencio rinda la necesidad de reaccionar.", medicinaPersistente: "El enojo constante suele denotar un espíritu exhausto que no tolera la debilidad ajena porque no abraza la propia. Entrar hoy en un silencio de palabras de 15 minutos, descansando en la paciencia de Cristo, es un paso de sanidad.", pasajePersistente: "Santiago 1:19-20" },
            f_cansancio: { raiz: "Fatiga Crónica del Templo", sintoma: "Fatiga suprarrenal, agotamiento muscular constante y necesidad de estimulantes para sostener el día.", pasaje: "Mateo 11:28-30", textoBiblico: "Vengan a mí los cansados y agobiados, y yo les daré verdadero descanso.", medicina: "El cuerpo no es una máquina de rendimiento; es templo del Espíritu. El ritmo que Dios nunca pidió sostener en soledad puede soltarse.", anclajeCorporal: "Sentarse y dejar caer los hombros por completo. Inhalar contando hasta cuatro y, al exhalar, susurrar: 'Tomo tu yugo, que es ligero'. Repetir tres veces.", medicinaPersistente: "El cuerpo sigue pidiendo auxilio aun durmiendo. Esto ya no es solo cansancio: es una señal de que hace falta descanso real, no solo espiritual sino físico. Apartar hoy un espacio para dormir o desconectarse sin culpa es un acto de buena mayordomía del templo.", pasajePersistente: "Éxodo 33:14" },
            hechiceria_atajos: { raiz: "Control y Atajos", sintoma: "Tensión en el pecho, respiración corta y una necesidad urgente de resolver todo de inmediato.", pasaje: "Isaías 30:15", textoBiblico: "En el reposo y la quietud confiada está tu verdadera fortaleza, no en tus propios atajos.", medicina: "La ansiedad busca atajos para calmarse rápido, pero solo la confianza en Su tiempo perfecto trae paz duradera. El control de los resultados puede soltarse.", anclajeCorporal: "Abrir las manos sobre las piernas y respirar lento. Al exhalar, decir en voz baja: 'Suelto el atajo, confío en Tu tiempo'.", medicinaPersistente: "Recurrir al control o la manipulación para calmar la impotencia suele repetirse. Esto revela una desconfianza profunda en la soberanía de Dios. Hoy, antes de forzar una situación, detenerse y orar primero es el camino de fe.", pasajePersistente: "Salmo 27:14" },
            arrogancia_rigidez: { raiz: "Arrogancia y Rigidez", sintoma: "Mandíbula apretada, tono de voz elevado y rigidez corporal al ser contradicho.", pasaje: "Proverbios 16:18", textoBiblico: "Antes de la caída siempre llega la soberbia del corazón.", medicina: "La necesidad de tener siempre la razón suele ser un escudo para no sentirse vulnerable. Jesús invita a soltar la armadura y dejarse corregir con mansedumbre.", anclajeCorporal: "Relajar conscientemente la mandíbula y los puños. Inclinar ligeramente la cabeza y decir: 'Prefiero la paz de Cristo a tener la razón'.", medicinaPersistente: "Imponer el propio criterio, como si de eso dependiera el valor personal, suele repetirse. Esa rigidez agota las relaciones y el propio espíritu. Hoy, ceder conscientemente en un punto que normalmente se defendería es un acto de mansedumbre.", pasajePersistente: "Filipenses 2:3-4" },
            mansedumbre_control: { raiz: "Resistencia al Cambio", sintoma: "Tensión muscular repentina, irritabilidad súbita e impaciencia física cuando los planes cambian.", pasaje: "Salmo 46:10", textoBiblico: "Quédate quieto y reconoce que Él es Dios, aun cuando todo cambie a tu alrededor.", medicina: "La mansedumbre no exige que todo salga como fue planeado; es fuerza rendida que confía en que Dios gobierna incluso el cambio inesperado.", anclajeCorporal: "Aflojar las manos que quizás estén cerradas en puño. Respirar hondo y, al exhalar, decir: 'Suelto mi plan, recibo el Tuyo'.", medicinaPersistente: "Cada cambio de planes sigue sacudiendo con la misma fuerza. Esto delata que la paz depende del control, y no de Dios. Practicar hoy decir 'está bien' ante un imprevisto pequeño, sin resistirlo, entrena la confianza.", pasajePersistente: "Proverbios 19:21" },
            humildad_rendimiento: { raiz: "Identidad en el Rendimiento", sintoma: "Opresión en el pecho y fatiga mental al no completar las tareas o metas espirituales propuestas.", pasaje: "Efesios 2:8-9", textoBiblico: "Por gracia has sido salvo, no por tus obras, para que nadie se gloríe.", medicina: "El valor ante Dios nunca dependió de la productividad. Su gracia sostiene incluso en los días en que no se logra nada.", anclajeCorporal: "Colocar ambas manos abiertas sobre el regazo, símbolo de recibir en vez de producir. Respirar y decir: 'Soy amado no por lo que hago, sino por quién soy en Ti'.", medicinaPersistente: "Medir la cercanía con Dios por el desempeño o la actividad espiritual suele repetirse. Esto es agotador y no es el evangelio de la gracia. Hoy, descansar de una actividad productiva y simplemente permanecer en Su presencia sin hacer nada es en sí mismo un acto de fe.", pasajePersistente: "Juan 15:4-5" }
        };

        // Mapea cada raíz diagnosticada al tipo de tormenta pastoral (Mateo 7:24-27, Marcos 4:18-19, Juan 15:5-6)
        // al que conceptualmente pertenece, para que la alerta de tormenta ya no se elija al azar.
        const CATEGORIA_TORMENTA = {
            idolatria_control: 'arena',
            celos_comparacion: 'arena',
            mansedumbre_control: 'arena',
            f_cansancio: 'espinas',
            iras_irritacion: 'espinas',
            hechiceria_atajos: 'autosuficiencia',
            enemistades_muros: 'autosuficiencia',
            orgullo_autosuficiencia: 'autosuficiencia',
            arrogancia_rigidez: 'autosuficiencia',
            humildad_rendimiento: 'autosuficiencia'
        };

        const GLOSARIO = [

                    { id: 'org_5', titulo: 'Fase 5: Manifestar el Yugo Fácil', tipo: 'Manifestar', contenido: 'La evidencia de que el orgullo ha sido doblegado no es una falsa modestia, sino el descanso real. Cuando dejas de intentar sostener tu propia imagen y tu propio mundo, manifiestas el yugo fácil y la carga ligera que Jesús prometió a los humildes de corazón (Mateo 11:29).', reto_asimilacion: 'Evalúa tus hombros y tu cuello: ¿Sientes la tensión física de cargar el mundo? Rinde hoy conscientemente el control de tu vida.' }

                    { id: 'idl_2', titulo: 'Fase 2: Entender que el Control es una Ilusión', tipo: 'Entender', contenido: 'Entender la gracia es aceptar que no puedes sostener tu propio universo. "Ninguno de vosotros puede añadir a su estatura un codo" (Mateo 6:27). El control es una ilusión; el cuidado paternal de Dios es una realidad eterna.', reto_asimilacion: 'Lee Mateo 6:25-34. Escribe en un papel las cosas que intentas microgestionar y entrégaselas en oración al Padre.' },
                    { id: 'idl_3', titulo: 'Fase 3: Asimilar la Confianza Activa', tipo: 'Asimilar', contenido: 'Asimilar la paz requiere rendición voluntaria. No se trata de resignación pasiva, sino de confianza activa. Es la capacidad de decir: "Señor, hago mi parte con diligencia, pero el resultado te lo entrego a ti".', reto_asimilacion: 'Hoy, cada vez que sientas la urgencia de forzar un resultado o manipular una respuesta, haz una pausa y repite: "Señor, confío en tu tiempo y tu forma".' },
                    { id: 'idl_4', titulo: 'Fase 4: Enseñar a Través del Descanso', tipo: 'Enseñar', contenido: 'Quien ha sido sanado de la idolatría del control enseña a otros a través del descanso. Lidera, aconseja y cuida a su familia sin asfixiar, permitiendo que Dios trabaje en los procesos de cada persona a su propio ritmo.', reto_asimilacion: 'Delega hoy una responsabilidad importante a alguien cercano sin supervisar cada detalle. Confía en el proceso.' },
                    { id: 'idl_5', titulo: 'Fase 5: Manifestar Ecuanimidad ante lo Imprevisto', tipo: 'Manifestar', contenido: 'La manifestación evidente de este discipulado es la ecuanimidad ante lo imprevisto. Cuando los planes cambian o los problemas surgen, el corazón transformado no entra en pánico, porque su ancla está en la fidelidad de Dios, no en las circunstancias.', reto_asimilacion: 'Evalúa tu reacción la próxima vez que algo no salga como lo planificaste. ¿Hubo paz o necesidad de imponer tu voluntad?' }

                    { id: 'ene_2', titulo: 'Fase 2: Entender la Deuda Ya Pagada', tipo: 'Entender', contenido: 'El perdón no es minimizar el daño ni decir que "no pasó nada"; es decidir no cobrar la deuda porque Jesús ya pagó la tuya en la cruz. "Perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo" (Efesios 4:32).', reto_asimilacion: 'Lee la parábola del siervo no misericordioso en Mateo 18:21-35. Compara la inmensa deuda que Dios te perdonó con la deuda de tu ofensor.' },
                    { id: 'ene_3', titulo: 'Fase 3: Asimilar la Decisión de Soltar', tipo: 'Asimilar', contenido: 'Asimilar el perdón es comprender que la amargura es un veneno que tú te tomas esperando que el otro muera. Perdonar es una decisión de la voluntad, no una emoción; es soltar la cadena que te ataba a tu ofensor.', reto_asimilacion: 'En un acto de oración consciente, nombra a tu ofensor y dile a Dios: "Suelto la deuda de esta persona, entrego el juicio en tus manos".' },
                    { id: 'ene_4', titulo: 'Fase 4: Enseñar como Puente de Paz', tipo: 'Enseñar', contenido: 'Quien ha sido sanado de la amargura se convierte en un puente de paz. Ya no alimenta chismes, bandos ni divisiones, sino que enseña a otros cómo el amor cubre multitud de faltas (1 Pedro 4:8).', reto_asimilacion: 'Refrena cualquier comentario negativo sobre una persona que te haya herido cuando estés en grupo.' },
                    { id: 'ene_5', titulo: 'Fase 5: Manifestar la Bendición al Ofensor', tipo: 'Manifestar', contenido: 'La manifestación obvia del perdón es la capacidad de bendecir a quien te dañó. "Bendecid a los que os persiguen" (Romanos 12:14). Sientes ligereza en el alma y el recuerdo de la herida pierde su poder para amargarte el presente.', reto_asimilacion: 'Haz una oración sincera pidiendo la bendición y la gracia de Dios para la persona que solías resentir.' }

            },

                titulo: 'Fatiga Crónica del Templo',

                descripcion: 'Honrar los límites del cuerpo y la mente como un acto de adoración y confianza en el sustento de Dios.',

                referencia_chosen: '',
                entregas: [
                    { id: 'fat_1', titulo: 'Fase 1: Discernir el Rendimiento Disfrazado de Servicio', tipo: 'Discernir', contenido: 'El agotamiento continuo no siempre es fruto de "mucho trabajo para el Señor", sino de trabajar desde nuestras propias fuerzas sin saber parar. Discernir la fatiga es admitir que hemos convertido el rendimiento en nuestro valor personal.', reto_asimilacion: '¿Estás trabajando y sirviendo desde la plenitud del Espíritu, o desde la inercia de no saber decir que no?' },
                    { id: 'fat_2', titulo: 'Fase 2: Entender el Regalo del Límite', tipo: 'Entender', contenido: 'Dios instituyó el descanso no porque Él estuviera cansado, sino porque nosotros lo necesitamos. Entender el límite de tu cuerpo es un acto de humildad: reconoce que el mundo y la iglesia siguen funcionando cuando tú duermes, porque Dios es quien lo sostiene todo.', reto_asimilacion: 'Reflexiona sobre tu relación con el descanso: ¿Sientes culpa cuando no estás siendo "productivo"? ¿Por qué?' },
                    { id: 'fat_3', titulo: 'Fase 3: Asimilar Fronteras Saludables', tipo: 'Asimilar', contenido: 'Asimilar el descanso es establecer fronteras saludables. Es aprender a desconectarse de la prisa del mundo para reconectarse con la presencia de Dios y el renuevo de las fuerzas físicas y emocionales.', reto_asimilacion: 'Establece hoy un bloque de tiempo innegociable de descanso o desconexión digital para esta semana y cúmplelo.' },
                    { id: 'fat_4', titulo: 'Fase 4: Enseñar un Servicio Sostenible', tipo: 'Enseñar', contenido: 'Quien aprende a cuidar el templo de Dios enseña a otros a servir sin quemarse. Tu vida se convierte en un modelo de sostenibilidad espiritual, donde el servicio brota del gozo y no del agotamiento.', reto_asimilacion: 'Anima a un hermano o colaborador que veas agotado a tomarse un tiempo de descanso y ayúdale a cubrir sus cargas.' },
                    { id: 'fat_5', titulo: 'Fase 5: Manifestar Fuerzas Renovadas', tipo: 'Manifestar', contenido: 'La manifestación de esta sanidad es la renovación constante de tus fuerzas. Vives con energía para lo importante, con mente clara y con un espíritu dispuesto a escuchar la voz de Dios en el silencio.', reto_asimilacion: 'Observa tu nivel de energía y paciencia al final del día. Que tu descanso restaurado se traduzca en amor para los tuyos.' }

                entregas: [
                    { id: 'ata_1', titulo: 'Fase 1: Discernir el Intento de "Ayudar a Dios"', tipo: 'Discernir', contenido: 'Tomar atajos espirituales o emocionales es el intento de "ayudar a Dios" cuando sentimos que Él se tarda. Discernir este patrón es reconocer las veces que has recurrido a la manipulación, las medias verdades o la prisa para forzar las bendiciones.', reto_asimilacion: '¿En qué área de tu vida estás tentando a la prisa en lugar de esperar la dirección clara del Espíritu Santo?' },
                    { id: 'ata_2', titulo: 'Fase 2: Entender que el Cómo y el Cuándo son Sagrados', tipo: 'Entender', contenido: 'Los atajos humanos siempre generan complicaciones posteriores (como Ismael en la historia de Abraham). Entender el camino de Dios es comprender que el "cómo" y el "cuándo" son tan sagrados como el "qué".', reto_asimilacion: 'Escribe sobre alguna ocasión en la que forzaste una puerta que Dios no había abierto. ¿Qué consecuencias trajo intentar acelerar el proceso?' },
                    { id: 'ata_3', titulo: 'Fase 3: Asimilar la Espera Confiada', tipo: 'Asimilar', contenido: 'Asimilar la espera requiere afianzar el corazón en que la voluntad de Dios es buena, agradable y perfecta. Es aprender a estar quietos en la presencia de Dios mientras Él prepara tanto la promesa como tu corazón para recibirla.', reto_asimilacion: 'Decide hoy renunciar a cualquier estrategia humana dudosa o apresurada para resolver un problema. Pon el asunto en las manos de Dios.' },
                    { id: 'ata_4', titulo: 'Fase 4: Enseñar con un Testimonio de Integridad', tipo: 'Enseñar', contenido: 'Quien ha aprendido a no tomar atajos enseña con su testimonio de integridad. Muestra a otros que es mejor esperar en Dios en el desierto que habitar en una tierra prometida alcanzada por medios humanos.', reto_asimilacion: 'Comparte con alguien más joven en la fe la importancia de no apresurar las etapas y esperar la confirmación de Dios.' },
                    { id: 'ata_5', titulo: 'Fase 5: Manifestar Fruto Legítimo y Duradero', tipo: 'Manifestar', contenido: 'La manifestación de este discipulado es una vida que da fruto legítimo y duradero a su tiempo. Vives con la solidez de quien sabe que lo que tiene ha sido dado por la gracia de Dios y no por astucia humana.', reto_asimilacion: 'Agradece a Dios por las puertas que Él ha cerrado para protegerte de tus propias prisas.' }
                ]
            },
            arrogancia_rigidez: {

                descripcion: 'Soltar el dogmatismo legalista y la dureza de corazón para abrazar la verdad envuelta en la gracia de Cristo.',

                referencia_chosen: '',
                entregas: [
                    { id: 'arr_1', titulo: 'Fase 1: Discernir el Temor Detrás de la Rigidez', tipo: 'Discernir', contenido: 'La rigidez doctrinaria o moral suele esconder un temor a la vulnerabilidad o a no tener la razón. Discernir este síntoma es reconocer cuando usas la verdad no para sanar, sino como un mazo para juzgar o distanciarte de los demás.', reto_asimilacion: 'Identifica una opinión o postura en la que te cuesta ceder: ¿Buscas edificar a la persona o simplemente demostrar que estás en lo correcto?' },
                    { id: 'arr_2', titulo: 'Fase 2: Entender la Gracia y la Verdad Juntas', tipo: 'Entender', contenido: 'Jesús vino "lleno de gracia y de verdad" (Juan 1:14). La verdad sin gracia se vuelve crueldad; la gracia sin verdad se vuelve condescendencia. Entender a Cristo es comprender que la sana doctrina siempre produce un corazón blando y compasivo.', reto_asimilacion: 'Lee Mateo 9:10-13. Observa cómo Jesús priorizó la misericordia sobre los rituales rigurosos de los fariseos.' },
                    { id: 'arr_3', titulo: 'Fase 3: Asimilar la Verdad en Amor', tipo: 'Asimilar', contenido: 'Asimilar esta transformación implica aprender a "seguir la verdad en amor" (Efesios 4:15). Es la capacidad de mantener principios firmes con una actitud amable, escuchando genuinamente a los demás sin ponérteles encima.', reto_asimilacion: 'En tu próxima conversación difícil, escucha el 80% del tiempo sin interrumpir ni preparar mentalmente tu defensa.' },
                    { id: 'arr_4', titulo: 'Fase 4: Enseñar a Través de la Restauración', tipo: 'Enseñar', contenido: 'Quien ha sido librado de la rigidez enseña a otros a través de la restauración. "Si alguno fuere sorprendido en alguna falta, vosotros que sois espirituales, restauradle con espíritu de mansedumbre" (Gálatas 6:1).', reto_asimilacion: 'Si debes corregir a alguien esta semana, hazlo en privado, asegurándote de que sienta tu amor antes que tu corrección.' },
                    { id: 'arr_5', titulo: 'Fase 5: Manifestar un Carácter Accesible', tipo: 'Manifestar', contenido: 'La evidencia de esta sanidad es un carácter accesible. Las personas ya no te temen ni te evitan; encuentran en ti un refugio seguro donde la verdad de Dios se comunica con la calidez del Padre.', reto_asimilacion: 'Pregunta a alguien cercano si te percibe como una persona accesible o como alguien rígido frente a las fallas ajenas.' }

            },

                    { id: 'man_2', titulo: 'Fase 2: Entender los Odres Nuevos', tipo: 'Entender', contenido: 'Jesús enseñó que no se pone vino nuevo en odres viejos porque se rompen (Lucas 5:37-38). Entender la mansedumbre es reconocer que Dios es dinámico; requiere que nuestro corazón permanezca blando para adaptarse a sus temporadas.', reto_asimilacion: 'Lee Isaías 43:18-19. Escribe qué cosas del pasado estás permitiendo que impidan lo "nuevo" que Dios quiere hacer hoy.' },
                    { id: 'man_3', titulo: 'Fase 3: Asimilar la Fuerza Bajo Control', tipo: 'Asimilar', contenido: 'Asimilar la mansedumbre no es debilidad, sino fuerza bajo control. Es la capacidad de decir: "Señor, no mi voluntad, sino la tuya". Es estar dispuesto a desaprender esquemas humanos para aprender los caminos de la gracia.', reto_asimilacion: 'Toma una decisión esta semana que implique salir de tu zona de confort para obedecer una convicción del Espíritu Santo.' },
                    { id: 'man_4', titulo: 'Fase 4: Enseñar con Paciencia los Ritmos de Cada Corazón', tipo: 'Enseñar', contenido: 'El líder o hermano manso no impone cambios a la fuerza; guía a otros con paciencia respetando los ritmos de transformación que el Espíritu opera en cada corazón.', reto_asimilacion: 'Anima a alguien que esté atravesando una transición difícil o un cambio inesperado en su vida.' },
                    { id: 'man_5', titulo: 'Fase 5: Manifestar un Espíritu Moldeable', tipo: 'Manifestar', contenido: 'La manifestación de la mansedumbre es un espíritu apacible y moldeable. Te vuelves una persona que fluye con la providencia divina sin amargura, reaccionando a las curvas del camino con fe y no con terquedad.', reto_asimilacion: 'Observa tu reacción interna ante los imprevistos de la semana: ¿Protestas por la interrupción o preguntas a Dios qué quiere enseñarte?' }

                    { id: 'hum_2', titulo: 'Fase 2: Entender la Filiación Antes de la Función', tipo: 'Entender', contenido: 'Antes de que Jesús hiciera un solo milagro o predicara un sermón, el Padre dijo: "Este es mi Hijo amado, en quien tengo complacencia" (Mateo 3:17). Tu identidad descansa en la filiación, no en la función.', reto_asimilacion: 'Medita en Romanos 8:15-17. Declara en oración tu posición de hijo/a por encima de tu rol de servidor o trabajador.' },
                    { id: 'hum_3', titulo: 'Fase 3: Asimilar Recibir Antes que Dar', tipo: 'Asimilar', contenido: 'Asimilar la gracia es aprender a recibir antes que a dar. Significa desprenderte de la medalla del logro humano y entender que tu mayor título no es tus éxitos o tu posición, sino estar "en Cristo".', reto_asimilacion: 'Dedica un tiempo de oración sin pedir nada ni repasar tus metas; simplemente quédate en silencio agradeciendo a Dios por ser su hijo.' },

            datos: {},
            timerInterval: null,
            segundosRestantes: 0,

            inicializar() {
                const perfilesGuardados = localStorage.getItem('senda_antigua_perfiles');
                const activoGuardado = localStorage.getItem('senda_antigua_perfil_activo');

                if (perfilesGuardados) {
                    try {
                        this.perfiles = JSON.parse(perfilesGuardados);
                        this.perfilActivo = activoGuardado || '';
                    } catch (e) {
                        this.crearPerfilPorDefecto();
                    }
                }

                if (this.perfilActivo && !this.perfiles[this.perfilActivo]) {
                    this.perfilActivo = '';
                }

                this.configurarDOMGlobal();
                this.actualizarSelectorUI();
                this.irAPantallaEntradaBienvenida();
            },

            crearPerfilPorDefecto() {
                this.perfiles = {};
                this.perfilActivo = '';
                this.guardarTodo();
            },

            guardarTodo() {
                localStorage.setItem('senda_antigua_perfiles', JSON.stringify(this.perfiles));
                localStorage.setItem('senda_antigua_perfil_activo', this.perfilActivo);
            },

            limpiarHilosYConsola() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });

                const viewport = document.getElementById('app-viewport');
                if (viewport) {
                    viewport.className = "w-full max-w-xl bg-white rounded-[2.5rem] p-6 md:p-10 shadow-sm border border-stone-100/80 relative";
                }
            },

            clickEnLogo() {
                if (this.datos && this.datos.faseActual === 'sendero_dashboard') {
                    this.irAFase('sendero_dashboard');
                } else if (Object.keys(this.perfiles).length > 0) {
                    this.irAPantallaEntradaBienvenida();
                } else {
                    this.irAFaseCreacionPerfil();
                }
            },

            irAPantallaEntradaBienvenida() {
                this.limpiarHilosYConsola();
                this.perfilActivo = '';
                this.datos = {};
                this.guardarTodo();
                this.actualizarSelectorUI();

                const progHeader = document.getElementById('progreso-header');
                if (progHeader) progHeader.innerText = "La Senda Antigua";

                const viewport = document.getElementById('app-viewport');
                if (viewport) viewport.innerHTML = VistaEntradaBienvenidaNeutral();
            },

            cargarPerfil(nombre) {
                if (!nombre || nombre.trim() === "") return;

                if (this.perfilActivo) {
                    this.guardar();
                }

                this.limpiarHilosYConsola();

                this.perfilActivo = nombre;
                if (!this.perfiles[nombre]) {
                    this.perfiles[nombre] = obtenerPerfilBase(nombre);
                }
                this.datos = this.perfiles[nombre];

                // Saneamiento defensivo: perfiles creados en versiones previas de la app
                // pueden carecer de campos añadidos después. Nunca deben quedar undefined.
                if (this.datos.indicePregunta === undefined) this.datos.indicePregunta = 0;
                if (!this.datos.respuestasTest) this.datos.respuestasTest = {};
                if (this.datos.diaActual === undefined) this.datos.diaActual = 1;
                if (!this.datos.sintomasCriticos) this.datos.sintomasCriticos = [];
                if (!this.datos.sintomasCicloAnterior) this.datos.sintomasCicloAnterior = [];
                if (!this.datos.victorias) this.datos.victorias = [];
                if (!this.datos.conteoCronicidad) this.datos.conteoCronicidad = {};
                if (!this.datos.historicoFisiologico) this.datos.historicoFisiologico = { deshidratado: false, insomnio: false, pantallas: false };
                if (!this.datos.obrasSeleccionadas) this.datos.obrasSeleccionadas = [];
                if (!this.datos.registroDias) this.datos.registroDias = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null, 8: null, 9: null, 10: null, 11: null, 12: null, 13: null, 14: null };
                if (!this.datos.registroGratitud) this.datos.registroGratitud = {};
                if (this.datos.testimonioEstacion === undefined) this.datos.testimonioEstacion = '';
                if (!this.datos.progresoDiscipulado) this.datos.progresoDiscipulado = {};
                if (this.datos.temaActivoId === undefined) this.datos.temaActivoId = null;
                if (this.datos.entregaActivaId === undefined) this.datos.entregaActivaId = null;

                // Corrección de bug: faseAntesDeDiscipulado es una variable compartida
                // (no pertenece a ningún perfil). Si no se limpia aquí, cambiar de
                // perfil mientras se navega el módulo de discipulados puede filtrar
                // la fase de OTRO perfil hacia este — llevándolo a un destino
                // incorrecto (ej. un perfil nuevo terminando en el dashboard vacío).
                faseAntesDeDiscipulado = null;

                this.guardarTodo();
                this.actualizarSelectorUI();
                this.renderizarFaseActual();
            },

            guardar() {
                if (this.perfilActivo) {
                    this.perfiles[this.perfilActivo] = this.datos;
                    this.guardarTodo();
                }
            },

            irAFaseCreacionPerfil() {
                this.limpiarHilosYConsola();
                const viewport = document.getElementById('app-viewport');
                const progHeader = document.getElementById('progreso-header');
                if (progHeader) progHeader.innerText = "Nuevo Comienzo";
                if (viewport) viewport.innerHTML = VistaCrearPerfilInicial();
            },

            irAFase(nuevaFase) {
                this.limpiarHilosYConsola();

                const viewport = document.getElementById('app-viewport');
                if (viewport) {
                    viewport.classList.remove('fade-in');
                    void viewport.offsetWidth;
                    viewport.classList.add('fade-in');
                }

                this.datos.faseActual = nuevaFase;
                this.guardar();
                this.renderizarFaseActual();
            },

            reiniciarCamino() {
                if (confirm(`¿Deseas reiniciar la estación? Se guardará tu historial de progreso y victorias en Cristo.`)) {
                    this.limpiarHilosYConsola();
                    const historico = this.datos.tipoRuta;
                    const victoriasPrevias = this.datos.victorias || [];
                    const sintomasPasados = this.datos.sintomasCriticos || [];
                    const cronicidadPrevia = this.datos.conteoCronicidad || {};

                    this.perfiles[this.perfilActivo] = obtenerPerfilBase(this.perfilActivo);
                    this.perfiles[this.perfilActivo].historicoRuta = historico;
                    this.perfiles[this.perfilActivo].victorias = victoriasPrevias;
                    this.perfiles[this.perfilActivo].sintomasCicloAnterior = sintomasPasados;
                    this.perfiles[this.perfilActivo].conteoCronicidad = cronicidadPrevia;

                    this.datos = this.perfiles[this.perfilActivo];
                    this.guardar();
                    this.renderizarFaseActual();
                }
            },

            configurarDOMGlobal() {
                const logo = document.getElementById('logo-senda');
                if (logo) {
                    logo.onclick = (e) => {
                        e.preventDefault();
                        this.clickEnLogo();
                    };
                }

                const selector = document.getElementById('selector-perfiles');
                if (selector) {
                    selector.onchange = (e) => {
                        if (e.target.value === "") {
                            this.irAPantallaEntradaBienvenida();
                        } else {
                            this.cargarPerfil(e.target.value);
                        }
                    };
                }

                const btnNuevo = document.getElementById('btn-nuevo-perfil');
                if (btnNuevo) {
                    btnNuevo.onclick = () => {
                        const nombre = prompt("Ingresa el nombre de pila para este perfil familiar (ej. Mateo):");
                        if (nombre && nombre.trim() !== "") {
                            const limpio = textClean(nombre);
                            if (this.perfiles[limpio]) {
                                alert("Ya existe un espacio con ese nombre.");
                                return;
                            }
                            this.perfiles[limpio] = obtenerPerfilBase(limpio);
                            this.guardarTodo();
                            this.cargarPerfil(limpio);
                        }
                    };
                }
            },

            actualizarSelectorUI() {
                const selector = document.getElementById('selector-perfiles');
                if (!selector) return;

                if (Object.keys(this.perfiles).length === 0) {
                    selector.innerHTML = `<option value="">Sin perfiles</option>`;
                    return;
                }

                const opciones = Object.keys(this.perfiles).map(p => `
                    <option value="${p}" ${p === this.perfilActivo ? 'selected' : ''}>${p}</option>
                `).join('');

                selector.innerHTML = `<option value="" ${this.perfilActivo === '' ? 'selected' : ''}>-- Seleccionar perfil --</option>` + opciones;
            },

            renderizarFaseActual() {
                const viewport = document.getElementById('app-viewport');
                const progHeader = document.getElementById('progreso-header');

                if (!viewport) return;

                if (!this.perfilActivo) {
                    this.irAPantallaEntradaBienvenida();
                    return;
                }

                if (!this.datos.faseActual) {
                    this.datos.faseActual = 'bienvenida';
                }

                if (progHeader) {
                    switch (this.datos.faseActual) {
                        case 'bienvenida': progHeader.innerText = "El Llamado"; break;
                        case 'filtro_templo': progHeader.innerText = "Mantenimiento del Templo"; break;
                        case 'amad_test': progHeader.innerText = "Fase 1: Detenerse"; break;
                        case 'tormenta_pastoral': progHeader.innerText = "La Mirada del Pastor"; break;
                        case 'resync_timer': progHeader.innerText = "Fase 1: Silencio"; break;
                        case 'raah_confesion': progHeader.innerText = "Fase 2: Volver en sí"; break;
                        case 'netibot_gracia': progHeader.innerText = "Fase 3: Preguntar"; break;
                        case 'halak_obras': progHeader.innerText = "Fase 4: El Caminar"; break;
                        case 'sendero_dashboard': progHeader.innerText = `Día ${this.datos.diaActual} — Estación`; break;
                        case 'checkpoint_evaluacion': progHeader.innerText = (this.datos.diaActual >= 14) ? "Examen Final de la Estación" : "Estación de Reposo"; break;
                        case 'estacion_completada': progHeader.innerText = "Estación Completada 🌿"; break;
                        case 'vista_discipulados': progHeader.innerText = "Biblioteca de Discipulado"; break;
                        case 'mapa_tema': progHeader.innerText = (TEMAS_DISCIPULADO[this.datos.temaActivoId] || {}).titulo || "Mapa del Tema"; break;
                        case 'vista_entrega': progHeader.innerText = "Discipulado — Entrega"; break;
                        default: progHeader.innerText = "";
                    }
                }

                switch (this.datos.faseActual) {
                    case 'bienvenida': viewport.innerHTML = VistaBienvenida(); break;
                    case 'filtro_templo': viewport.innerHTML = VistaFiltroTemplo(); break;
                    case 'amad_test': viewport.innerHTML = VistaAmadTest(); break;
                    case 'tormenta_pastoral': viewport.innerHTML = VistaTormentaPastoral(); break;
                    case 'resync_timer': viewport.innerHTML = VistaResyncTimer(); iniciarReloj(); break;
                    case 'raah_confesion': viewport.innerHTML = VistaRaahConfesion(); break;
                    case 'netibot_gracia': viewport.innerHTML = VistaNetibotGracia(); break;
                    case 'halak_obras': viewport.innerHTML = VistaHalakObras(); break;
                    case 'sendero_dashboard': viewport.innerHTML = VistaSenderoDashboard(); break;
                    case 'checkpoint_evaluacion': viewport.innerHTML = VistaCheckpointEvaluacion(); break;
                    case 'estacion_completada': viewport.innerHTML = VistaEstacionCompletada(); break;
                    case 'vista_discipulados': viewport.innerHTML = VistaDiscipulados(); break;
                    case 'mapa_tema': viewport.innerHTML = VistaMapaTema(); break;
                    case 'vista_entrega': viewport.innerHTML = VistaEntregaDiscipulado(); break;
                    default: viewport.innerHTML = VistaBienvenida();
                }
            }
        };

        // ===================================================================
        // FUNCIONES AUXILIARES Y MODALES (AYUDA / GLOSARIO)
        // ===================================================================

        function textClean(text) {
            return text.replace(/<[^>]*>/g, '').trim();
        }

        function registrarPerfilInicial() {
            const input = document.getElementById('nombre-inicial');
            if (input && input.value.trim() !== "") {
                const nombre = textClean(input.value);
                SendaEstado.perfiles[nombre] = obtenerPerfilBase(nombre);
                SendaEstado.perfilActivo = nombre;
                SendaEstado.datos = SendaEstado.perfiles[nombre];
                SendaEstado.guardarTodo();
                SendaEstado.actualizarSelectorUI();
                SendaEstado.irAFase('bienvenida');
            } else {
                alert("Por favor, ingresa un nombre para comenzar.");
            }
        }

        // Elimina un perfil por completo (y su progreso) de este dispositivo, previa
        // confirmación explícita — no hay forma de deshacer esta acción.
        function eliminarPerfil(nombre) {
            if (!SendaEstado.perfiles[nombre]) return;
            const confirmado = confirm(`¿Eliminar el perfil de "${nombre}"? Se perderá todo su progreso, respuestas y discipulados completados. Esta acción no se puede deshacer.`);
            if (!confirmado) return;

            delete SendaEstado.perfiles[nombre];

            if (SendaEstado.perfilActivo === nombre) {
                SendaEstado.perfilActivo = '';
                SendaEstado.datos = {};
            }

            SendaEstado.guardarTodo();
            SendaEstado.actualizarSelectorUI();
            SendaEstado.irAPantallaEntradaBienvenida();
        }

        function abrirModalAyuda(faseClave) {
            const modal = document.getElementById('modal-ayuda');
            const titulo = document.getElementById('modal-titulo');
            const contenido = document.getElementById('modal-contenido');
            const info = TEXTOS_AYUDA[faseClave] || TEXTOS_AYUDA.global;

            if (modal && titulo && contenido && info) {
                titulo.innerText = info.titulo;
                contenido.innerHTML = `<p class="text-base text-stone-600 leading-relaxed">${info.contenido}</p>`;
                modal.classList.remove('hidden');
            }
        }

        function abrirGlosario() {
            const modal = document.getElementById('modal-ayuda');
            const titulo = document.getElementById('modal-titulo');
            const contenido = document.getElementById('modal-contenido');

            if (modal && titulo && contenido) {
                titulo.innerText = "📙 Glosario de la Gracia";
                contenido.innerHTML = `
                    <p class="text-sm text-stone-500 mb-4">Conceptos transformadores definidos según la enseñanza y el ejemplo de Jesús:</p>
                    <div class="space-y-6">
                        ${GLOSARIO.map(g => `
                            <div class="border-b border-stone-100 pb-4">
                                <h4 class="font-bold text-senda-oliva text-lg">${g.termino}</h4>
                                <p class="text-base text-stone-600 leading-relaxed mt-1 font-light">${g.concepto}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
                modal.classList.remove('hidden');
            }
        }

        function cerrarModalAyuda() {
            const modal = document.getElementById('modal-ayuda');
            if (modal) modal.classList.add('hidden');
        }

        // Modal de video (Súper Libro, biblioteca de discipulado). Usa
        // construirUrlEmbedVideo() (definida más abajo, junto al resto del
        // módulo de discipulados) para aceptar ID plano, link de YouTube o Vimeo.
        function abrirModalVideo(videoId, titulo) {
            const modal = document.getElementById('modal-video');
            const iframe = document.getElementById('modal-video-iframe');
            const tituloEl = document.getElementById('modal-video-titulo');
            const linkVer = document.getElementById('modal-video-link-externo');
            if (!modal || !iframe || !videoId) return;
            iframe.src = construirUrlEmbedVideo(videoId);
            if (tituloEl) tituloEl.innerText = titulo || 'Video';
            if (linkVer) {
                const urlVer = construirUrlVerVideo(videoId);
                linkVer.href = urlVer;
                linkVer.innerText = urlVer.includes('vimeo.com') ? 'Abrir en Vimeo ↗' : 'Abrir en YouTube ↗';
            }
            modal.classList.remove('hidden');
        }

        function cerrarModalVideo() {
            const modal = document.getElementById('modal-video');
            const iframe = document.getElementById('modal-video-iframe');
            if (modal) modal.classList.add('hidden');
            if (iframe) iframe.src = ''; // detiene la reproducción al cerrar
        }

        // ===================================================================
        // FASE: FILTRO DEL TEMPLO FÍSICO (mantenimiento corporal básico)
        // ===================================================================

        function marcarFisiologia(clave) {
            if (!SendaEstado.datos.historicoFisiologico) {
                SendaEstado.datos.historicoFisiologico = { deshidratado: false, insomnio: false, pantallas: false };
            }
            SendaEstado.datos.historicoFisiologico[clave] = !SendaEstado.datos.historicoFisiologico[clave];
            SendaEstado.guardar();
            SendaEstado.renderizarFaseActual();
        }

        function VistaFiltroTemplo() {
            const f = SendaEstado.datos.historicoFisiologico || { deshidratado: false, insomnio: false, pantallas: false };
            const opciones = [
                { key: 'insomnio', label: "¿Has dormido menos de 6 horas en alguna de las últimas dos noches?" },
                { key: 'deshidratado', label: "¿Has tomado poca agua hoy (menos de un litro)?" },
                { key: 'pantallas', label: "¿Has pasado más de 8 horas consecutivas frente a una pantalla hoy?" }
            ];
            return `
                <div class="space-y-8">
                    <div class="text-center space-y-2">
                        <span class="text-xs uppercase tracking-[0.2em] text-senda-tierra font-semibold">1 Corintios 6:19</span>

        // ===================================================================
        // FASE 1 — AMAD: TEST DE EVALUACIÓN (10 preguntas, escala 1/3/5)
        // ===================================================================

        function VistaAmadTest() {
            const index = SendaEstado.datos.indicePregunta || 0;
            const pre = PREGUNTAS_TEST[index];
            const progreso = Math.round((index / PREGUNTAS_TEST.length) * 100);
            return `
                <div class="space-y-8">

                    <div class="space-y-3 pt-2">
                        ${OPCIONES_RESPUESTA.map(op => `
                            <button onclick="responderPregunta(${op.valor}, this)" class="opcion-btn w-full text-left px-5 py-4 md:p-6 rounded-2xl border-2 border-stone-200 bg-stone-50/60 hover:border-senda-oliva hover:bg-senda-fondo transition-all text-base md:text-lg text-stone-700">
                                ${op.texto}
                            </button>
                        `).join('')}
                    </div>
                    <div class="flex justify-between pt-2">
                        ${index > 0 ? `<button onclick="retrocederPregunta()" class="text-sm font-semibold text-stone-400 hover:text-senda-texto flex items-center space-x-1.5 transition-all"><span>← Volver a la anterior</span></button>` : '<div></div>'}
                    </div>
                </div>
            `;
        }

        function responderPregunta(valor, btnEl) {
            if (procesandoPregunta) return;
            procesandoPregunta = true;

            // Feedback visual inmediato: la opción elegida se marca en oliva sólido,
            // las demás se atenúan — luego, tras una breve pausa, se avanza a la
            // siguiente pregunta (o se procesa el diagnóstico si era la última).
            if (btnEl && btnEl.parentElement) {
                Array.from(btnEl.parentElement.children).forEach(b => {
                    b.onclick = null;
                    b.classList.remove('hover:border-senda-oliva', 'hover:bg-senda-fondo', 'bg-stone-50/60', 'text-stone-700');
                    if (b === btnEl) {
                        b.classList.add('bg-senda-oliva', 'border-senda-oliva', 'text-white', 'shadow-md');
                    } else {
                        b.classList.add('opacity-30');
                    }
                });
            }

            const index = SendaEstado.datos.indicePregunta || 0;
            const pre = PREGUNTAS_TEST[index];
            SendaEstado.datos.respuestasTest[pre.id] = valor;
            SendaEstado.guardar();

            setTimeout(() => {
                procesandoPregunta = false;
                if (index + 1 < PREGUNTAS_TEST.length) {
                    SendaEstado.datos.indicePregunta++;
                    SendaEstado.guardar();
                    SendaEstado.renderizarFaseActual();
                } else {
                    procesarDiagnostico();
                }
            }, 380);
        }

        function retrocederPregunta() {
            if (SendaEstado.datos.indicePregunta > 0) {
                SendaEstado.datos.indicePregunta--;
                SendaEstado.guardar();
                SendaEstado.renderizarFaseActual();
            }
        }

        function procesarDiagnostico() {
            let total = 0;
            const sintomasCriticosNuevos = [];
            SendaEstado.datos.sintomasCicloAnterior = SendaEstado.datos.sintomasCriticos || [];
            const sintomasAnterioresIds = SendaEstado.datos.sintomasCicloAnterior.map(s => s.id);

            if (!SendaEstado.datos.conteoCronicidad) SendaEstado.datos.conteoCronicidad = {};
            if (!SendaEstado.datos.victorias) SendaEstado.datos.victorias = [];

            for (let k in SendaEstado.datos.respuestasTest) {
                const valor = SendaEstado.datos.respuestasTest[k];
                total += valor;

                if (valor >= 2 && MEDICINA_TEOLOGICA[k]) {
                    const esPersistente = sintomasAnterioresIds.includes(k);
                    if (!SendaEstado.datos.conteoCronicidad[k]) SendaEstado.datos.conteoCronicidad[k] = 0;
                    SendaEstado.datos.conteoCronicidad[k]++;
                    sintomasCriticosNuevos.push({
                        id: k,
                        puntuacion: valor,
                        persistente: esPersistente,
                        consecutivos: SendaEstado.datos.conteoCronicidad[k],
                        ...MEDICINA_TEOLOGICA[k]
                    });
                } else if (valor < 2 && MEDICINA_TEOLOGICA[k]) {
                    const indexPasado = sintomasAnterioresIds.indexOf(k);
                    if (indexPasado !== -1) {
                        SendaEstado.datos.victorias.push({ id: k, raiz: MEDICINA_TEOLOGICA[k].raiz, fecha: new Date().toLocaleDateString() });
                    }
                    SendaEstado.datos.conteoCronicidad[k] = 0;
                }
            }

            SendaEstado.datos.resultadoCarga = total;
            SendaEstado.datos.sintomasCriticos = sintomasCriticosNuevos;
            const antiguoTipo = SendaEstado.datos.tipoRuta;
            let nuevoTipo = 'stable';

            if (total >= 18) { SendaEstado.datos.veredicto = "Yugo del Mundo (Cansancio Severo)"; nuevoTipo = "severo"; }
            else if (total >= 9) { SendaEstado.datos.veredicto = "Carga Desequilibrada (Límite de Alerta)"; nuevoTipo = "alerta"; }
            else { SendaEstado.datos.veredicto = "Senda Estable (Busca Constancia)"; nuevoTipo = "stable"; }

            SendaEstado.datos.tipoRuta = nuevoTipo;
            SendaEstado.datos.indicePregunta = 0;
            SendaEstado.datos.alertaTormentaActiva = null;

            if (antiguoTipo) {
                const jerarquia = { 'stable': 1, 'alerta': 2, 'severo': 3 };
                if (jerarquia[nuevoTipo] > jerarquia[antiguoTipo]) {
                    SendaEstado.datos.alertaTormentaActiva = determinarTipoTormenta(sintomasCriticosNuevos);
                }
            }

            SendaEstado.datos.historicoRuta = antiguoTipo;
            SendaEstado.guardar();

            if (SendaEstado.datos.alertaTormentaActiva) SendaEstado.irAFase('tormenta_pastoral');
            else SendaEstado.irAFase('resync_timer');
        }

        // Determina qué tormenta pastoral corresponde según qué raíz(es) realmente pesan más
        // en este ciclo, en vez de elegir al azar. Usa la severidad MÁXIMA como criterio principal
        // (evita que 'autosuficiencia' gane solo por tener más raíces mapeadas que 'arena' o 'espinas')
        // y la suma total como desempate cuando dos tipos comparten la misma severidad máxima.
        function determinarTipoTormenta(sintomasCriticos) {
            const alertasPosibles = ['arena', 'espinas', 'autosuficiencia'];
            if (!sintomasCriticos || sintomasCriticos.length === 0) {
                return alertasPosibles[Math.floor(Math.random() * alertasPosibles.length)];
            }
            const stats = { arena: { max: 0, suma: 0 }, espinas: { max: 0, suma: 0 }, autosuficiencia: { max: 0, suma: 0 } };
            sintomasCriticos.forEach(s => {
                const tipo = CATEGORIA_TORMENTA[s.id];
                if (tipo) {
                    stats[tipo].suma += s.puntuacion;
                    if (s.puntuacion > stats[tipo].max) stats[tipo].max = s.puntuacion;
                }
            });
            let mejorTipo = alertasPosibles[0];
            let mejorMax = -1, mejorSuma = -1;
            for (let tipo of alertasPosibles) {
                const { max, suma } = stats[tipo];
                if (max > mejorMax || (max === mejorMax && suma > mejorSuma)) {
                    mejorMax = max; mejorSuma = suma; mejorTipo = tipo;
                }
            }
            return mejorTipo;
        }

        // ===================================================================
        // FASE: TORMENTA PASTORAL — alerta de deterioro (arena / espinas / autosuficiencia)

        function VistaTormentaPastoral() {

            return `

                    <div class="p-6 md:p-8 rounded-[2rem] bg-senda-fondo border border-amber-100/60 text-left space-y-4">

                    </div>
                    <p class="text-sm text-stone-400 font-light max-w-sm mx-auto leading-relaxed">No hay vergüenza ni juicio en Jesús. Simplificaremos tus compromisos durante estos 14 días para que puedas sanar.</p>
                    <div class="pt-4">
                        <button onclick="SendaEstado.irAFase('resync_timer')" class="w-full py-4 bg-senda-oliva text-white font-semibold rounded-2xl shadow-md text-base transition-all hover:bg-opacity-95 tracking-wide">
                            Recibir su Gracia e ir al Silencio
                        </button>
                    </div>
                </div>
            `;
        }

        // ===================================================================
        // FASE: SINCRONÍA SAGRADA (RE-SYNC) — 60 segundos de silencio con anillo animado
        // ===================================================================

        function VistaResyncTimer() {
            const veredicto = SendaEstado.datos.veredicto;
            const puntuacion = SendaEstado.datos.resultadoCarga;
            return `
                <div class="text-center space-y-8 py-4">
                    <div class="space-y-2">
                        <span class="text-xs uppercase tracking-[0.2em] text-senda-tierra font-semibold">Diagnóstico de la Gracia</span>

        function iniciarReloj() {
            if (SendaEstado.timerInterval) { clearInterval(SendaEstado.timerInterval); SendaEstado.timerInterval = null; }
            SendaEstado.segundosRestantes = 60;
            const relojTexto = document.getElementById('reloj-texto');
            const btn = document.getElementById('btn-completar-timer');

            if (!relojTexto) return;
            SendaEstado.timerInterval = setInterval(() => {
                SendaEstado.segundosRestantes--;
                if (relojTexto) relojTexto.innerText = SendaEstado.segundosRestantes;
                if (SendaEstado.segundosRestantes <= 0) {
                    clearInterval(SendaEstado.timerInterval);
                    SendaEstado.timerInterval = null;
                    if (btn) {
                        btn.disabled = false;
                        btn.classList.remove('bg-stone-200', 'text-stone-400', 'cursor-not-allowed');

        // ===================================================================

        function VistaRaahConfesion() {

                </div>

        function accionEntregarConfesion() {
            if (procesandoConfesion) return;
            const txt = document.getElementById('confesion-texto');
            const btn = document.getElementById('btn-entregar-confesion');
            if (txt && txt.value.trim() !== '') {
                procesandoConfesion = true;
                if (btn) btn.disabled = true;
                txt.value = textClean(txt.value);
                txt.classList.add('disolver');
                txt.disabled = true;
                setTimeout(() => {

                    procesandoConfesion = false;

        // ===================================================================
        // FASE 3 — NETIBOT: DESARMAR LA MENTIRA (3 tarjetas interactivas)
        // ===================================================================

        // Guarda las tarjetas de la renderización actual para que romperMentira()
        // las lea por índice — evita tener que incrustar el texto de la verdad
        // dentro del atributo onclick (más robusto frente a comillas especiales).
        let tarjetasNetibotActuales = [];

        function VistaNetibotGracia() {
            const esFinal = (SendaEstado.datos.diaActual || 1) >= 14;
            const siguienteFase = esFinal ? 'estacion_completada' : 'halak_obras';
            const textoBoton = esFinal ? 'Concluir mi Estación' : 'Avanzar: Diseñar mi Ritmo';

            // Las 3 mentiras se arman a partir del diagnóstico real de este ciclo,
            // priorizando las raíces más severas (El Gran Médico revela para sanar,
            // no genéricamente). Si la ruta viene estable y no hay raíces activas,
            // se usan 3 mentiras universales como respaldo pastoral.
            const sintomas = SendaEstado.datos.sintomasCriticos || [];
            const topSintomas = [...sintomas].sort((a, b) => (b.puntuacion || 0) - (a.puntuacion || 0)).slice(0, 3);

            tarjetasNetibotActuales = topSintomas.length > 0
                ? topSintomas.map(s => ({
                    etiqueta: s.raiz,
                    mentira: (MENTIRAS_POR_RAIZ[s.id] && MENTIRAS_POR_RAIZ[s.id].mentira) || "El enemigo susurra acusación sobre esta área de tu vida.",
                    verdad: (MENTIRAS_POR_RAIZ[s.id] && MENTIRAS_POR_RAIZ[s.id].verdad) || "La verdad de Cristo te hace libre (Juan 8:32)."
                }))
                : [
                    { etiqueta: 'La Acusación', mentira: 'Dios está enojado contigo por flaquear y te castigará privándote de Su presencia.', verdad: 'La cruz canceló toda acta de deudas. Dios no guarda un registro de ofensas para reclamarte (Miqueas 7:18).' },
                    { etiqueta: 'El Rendimiento', mentira: 'Debes esforzarte el doble y ser perfecto antes de volver a presentarte ante Dios.', verdad: 'La justicia de Jesús cubre por completo. No hace falta trabajar para ganar Su amor; hay reconciliación como hijos por fe (Efesios 2:8-9).' },
                    { etiqueta: 'El Miedo al Mañana', mentira: 'Has desaprovechado demasiado tiempo; ya es sumamente tarde para tu vida.', verdad: 'Él es el soberano del tiempo. Restaura las estaciones perdidas y de Su mano hay plenitud de gozo eterno (Joel 2:25).' }
                ];

            return `
                <div class="space-y-8">
                    <div class="text-center space-y-2">
                        <div class="flex items-center justify-center space-x-2">
                            <span class="text-xs uppercase tracking-[0.2em] text-senda-tierra font-semibold">Fase 3: Netibot</span>
                            <button onclick="abrirModalAyuda('fase3')" class="w-5 h-5 rounded-full bg-stone-200/50 text-xs text-stone-600 font-bold">?</button>
                        </div>
                        <h2 class="serif-title text-3xl md:text-4xl font-medium text-senda-texto">Desarmar la Mentira</h2>
                    </div>
                    <p class="text-base text-stone-500 font-light leading-relaxed text-center">
                        Para regresar a la gracia, hay que renunciar a las mentiras que la acusación y la prisa plantaron en la mente. Toca una mentira para desarmarla:
                    </p>
                    <div class="space-y-4">
                        ${tarjetasNetibotActuales.map((t, idx) => `

        // ===================================================================
        // FASE 4 — HALAK: ESTABLECER EL RITMO (selección de disciplinas/Protos)
        // ===================================================================

        // Sin límite de selección: el yugo de Jesús es fácil y ligero (Mateo 11:30),
        // no una cuota de compromisos que cumplir. La única guía es pastoral —ver el
        // mensaje de gracia en VistaHalakObras()—, nunca una restricción de código.
        function alternarObra(id) {
            const lista = SendaEstado.datos.obrasSeleccionadas;
            const idx = lista.indexOf(id);
            if (idx >= 0) {
                lista.splice(idx, 1);
            } else {
                lista.push(id);
            }
            SendaEstado.guardar();
            SendaEstado.renderizarFaseActual();
        }

        function guardarObrasEIniciarCaminar() {
            if (SendaEstado.datos.obrasSeleccionadas.length === 0) {
                alert("Por favor, selecciona al menos una vereda para comenzar tu caminar.");
                return;
            }
            // Si esta selección ocurre en el examen final del día 14, no hay más días
            // por delante: se concluye directamente la estación en vez de mostrar el dashboard.
            SendaEstado.datos.faseActual = ((SendaEstado.datos.diaActual || 1) >= 14) ? 'estacion_completada' : 'sendero_dashboard';
            SendaEstado.guardar();
            SendaEstado.renderizarFaseActual();
        }

        function alternarObraDia(id) {
            const dia = SendaEstado.datos.diaActual;
            if (!SendaEstado.datos.registroDias[dia] || typeof SendaEstado.datos.registroDias[dia] !== 'object') {
                SendaEstado.datos.registroDias[dia] = { completado: false, obrasCompletadas: [] };
            }
            const lista = SendaEstado.datos.registroDias[dia].obrasCompletadas;
            const idx = lista.indexOf(id);
            if (idx >= 0) { lista.splice(idx, 1); } else { lista.push(id); }
            SendaEstado.guardar();
            SendaEstado.renderizarFaseActual();
        }

        function guardarGratitud(dia) {
            const txt = document.getElementById('texto-yadah');
            const btn = document.getElementById('btn-guardar-yadah');
            if (txt && btn) {
                if (!SendaEstado.datos.registroGratitud) SendaEstado.datos.registroGratitud = {};
                SendaEstado.datos.registroGratitud[dia] = textClean(txt.value);
                SendaEstado.guardar();

                const habiaTexto = SendaEstado.datos.registroGratitud[dia] !== "";
                btn.innerText = "¡Altar Guardado!";
                btn.classList.add('bg-emerald-600');
                btn.classList.remove('bg-senda-tierra');
                setTimeout(() => {
                    btn.innerText = habiaTexto ? "Actualizar Altar de Gratitud" : "Ofrecer Gratitud y Perdón en el Altar";
                    btn.classList.remove('bg-emerald-600');
                    btn.classList.add('bg-senda-tierra');
                }, 2000);
            }
        }

        function guardarTestimonio() {
            const txt = document.getElementById('texto-testimonio');
            const btn = document.getElementById('btn-guardar-testimonio');
            if (txt && btn) {
                SendaEstado.datos.testimonioEstacion = textClean(txt.value);
                SendaEstado.guardar();

                const habiaTexto = SendaEstado.datos.testimonioEstacion !== "";
                btn.innerText = "¡Testimonio Guardado!";
                btn.classList.add('bg-emerald-600');
                btn.classList.remove('bg-senda-oliva');
                setTimeout(() => {
                    btn.innerText = habiaTexto ? "Actualizar mi Testimonio" : "Guardar mi Testimonio";
                    btn.classList.remove('bg-emerald-600');
                    btn.classList.add('bg-senda-oliva');
                }, 2000);

        function completarDiaActual() {
            const diaAct = SendaEstado.datos.diaActual || 1;

            if (!SendaEstado.datos.registroDias[diaAct] || typeof SendaEstado.datos.registroDias[diaAct] !== 'object') {
                SendaEstado.datos.registroDias[diaAct] = { completado: false, obrasCompletadas: [] };
            }
            const registroHoy = SendaEstado.datos.registroDias[diaAct];
            const totalObras = (SendaEstado.datos.obrasSeleccionadas || []).length;
            const hechas = registroHoy.obrasCompletadas.length;

            if (totalObras > 0 && hechas < totalObras) {
                const conf = confirm("Aún no has marcado todas tus veredas de hoy. ¿Deseas completar el día de todos modos? (Recuerda que no hay condenación en Cristo, esto es un ritmo de gracia, no de ley).");
                if (!conf) return;
            }

            registroHoy.completado = true;

            // --- Corrección de flujo de 14 días ---
            // El día 7 dispara una estación de reposo intermedia (re-examen) y luego
            // continúa hasta el día 14. El día 14 dispara un examen final propio y
            // concluye la estación, en vez de repetir el mensaje "completaste 7 días"
            // y quedar en bucle sobre el mismo día.
            const esUltimoDia = diaAct >= 14;
            const esCheckpointSemanal = diaAct === 7;

            if (!esUltimoDia) {
                SendaEstado.datos.diaActual = diaAct + 1;
            }

            if (esUltimoDia || esCheckpointSemanal) {
                SendaEstado.datos.faseActual = 'checkpoint_evaluacion';
            }
            // En cualquier otro día, faseActual permanece en 'sendero_dashboard'
            // y diaActual ya fue avanzado: el próximo render muestra el día siguiente.

            SendaEstado.guardar();
            SendaEstado.renderizarFaseActual();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleAccordion(id) {
            if (accordionState[id] === undefined) accordionState[id] = false;

            const content = document.getElementById(id);
            const chev = document.getElementById('chev-' + id);
            if (content) content.style.maxHeight = accordionState[id] ? '3000px' : '0px';
            if (chev) chev.style.transform = accordionState[id] ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        // Genera una sección colapsable consistente. El estado abierto/cerrado se
        // recuerda en accordionState durante la sesión (no se resetea al re-renderizar
        // por otras interacciones, solo al recargar la página).
        function renderAccordionSection(id, icono, titulo, contenidoHtml, abiertoPorDefecto) {
            if (accordionState[id] === undefined) accordionState[id] = !!abiertoPorDefecto;
            const abierto = accordionState[id];
            return `
                <div class="rounded-[2rem] border border-stone-200 bg-white shadow-sm overflow-hidden">
                    <button onclick="toggleAccordion('${id}')" class="opcion-btn w-full flex items-center justify-between gap-3 p-5 md:p-6 text-left hover:bg-stone-50/60">

        // ===================================================================
        // MÓDULO DE DISCIPULADOS PROFUNDOS — navegación y vistas
        // ===================================================================
        // Jerarquía de navegación (3 niveles, con "volver" propio en cada uno):
        //   Cabecera "📚 Discipulados"
        //     -> vista_discipulados  (biblioteca: cuadrícula de temas)
        //       -> mapa_tema         (línea de tiempo de un tema)
        //         -> vista_entrega   (video + lectura + reto de asimilación)
        // Al entrar se recuerda la fase de origen en faseAntesDeDiscipulado, así
        // que salirDeDiscipulados() siempre devuelve al usuario exactamente a
        // donde estaba (incluso si estaba a mitad del examen Amad, por ejemplo),
        // en vez de asumir siempre 'sendero_dashboard'.

        function irAVistaDiscipulados() {
            if (!SendaEstado.perfilActivo) {
                alert("Primero selecciona o crea tu perfil para acceder a los discipulados.");
                return;
            }
            const fasesDelModulo = ['vista_discipulados', 'mapa_tema', 'vista_entrega'];
            if (!fasesDelModulo.includes(SendaEstado.datos.faseActual)) {
                faseAntesDeDiscipulado = SendaEstado.datos.faseActual;
            }
            SendaEstado.irAFase('vista_discipulados');
        }

        function salirDeDiscipulados() {
            if (faseAntesDeDiscipulado) {
                SendaEstado.irAFase(faseAntesDeDiscipulado);
            } else if (SendaEstado.datos.tipoRuta) {
                // Ya completó al menos un ciclo del examen -> el dashboard tiene contenido real
                SendaEstado.irAFase('sendero_dashboard');
            } else {
                // Perfil nuevo, sin diagnóstico aún -> el dashboard estaría vacío;
                // lo correcto es retomar desde la bienvenida.
                SendaEstado.irAFase('bienvenida');
            }
        }

        function irAMapaTema(temaId) {

        }

        // Igual que irAMapaTema, pero pensada para el enlace de "El Gran Médico"
        // dentro del dashboard: recuerda la fase de origen (sendero_dashboard) tal
        // como lo hace irAVistaDiscipulados, para que "← Volver" en el mapa del
        // tema no se pierda el hilo de dónde venía el usuario.
        function irADiscipuladoSugerido(temaId) {
            if (!SendaEstado.perfilActivo) return;
            const fasesDelModulo = ['vista_discipulados', 'mapa_tema', 'vista_entrega'];
